name: Release

# Pushing a tag like v1.0.0 builds the APK and publishes it as a GitHub release,
# which is what the in-app update check and ObtainX both read.
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. 1.0.0 or v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Same shared key as the test builds, so a release installs over them.
      - name: Use the shared signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/shared-debug.keystore"
            cp "$RUNNER_TEMP/shared-debug.keystore" ~/.android/debug.keystore
            echo "SHARED_KEYSTORE=$RUNNER_TEMP/shared-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set; a release signed with a throwaway key could not be updated in place."
            exit 1
          fi

      - name: Build
        run: |
          ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark -PnoBenchmarkSuffix \
            -Pandroid.injected.signing.store.file="$SHARED_KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/dev/benchmark/*.apk | head -n1)
          cp "$APK" "BitChord-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "BitChord-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "BitChord-${TAG}.apk" \
              --title "BitChord ${TAG#v}" \
              --notes-file RELEASE_NOTES.md
          fi
