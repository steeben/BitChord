// Tests that already fail on upstream BitChord's main for reasons that have
// nothing to do with this fork. Used only by the Check workflow.
//  - GeniusTest live search: makes a real request to genius.com.
//  - zh-CN / zh-TW: the language list offers tags that have no matching
//    resource folder or locales_config.xml entry.
allprojects {
    tasks.withType(Test).configureEach {
        filter {
            excludeTestsMatching 'com.music.bitchord.GeniusTest.live genius*'
            excludeTestsMatching 'com.music.bitchord.LocaleStringsTest.*zh-CN*'
            excludeTestsMatching 'com.music.bitchord.LocaleStringsTest.*zh-TW*'
            excludeTestsMatching 'com.music.bitchord.LocalizationTest.localesConfig_matchesSupportedLanguages'
        }
    }
}
